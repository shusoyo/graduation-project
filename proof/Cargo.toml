[workspace]
members = [
    "code/sel4_cspace",
]
exclude = [
    "l4v-master",
    "vostd-main",
    "proofs",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
rel4-utils = { path = "../rel4_kernel/rel4-utils" }

# Verus
# Intentionally left unwired for now because this workspace does not yet carry
# a local `tools/verus/source/vstd` checkout like `vostd-main`.

[patch.'https://github.com/reL4team2/sel4_common.git']
sel4_common = { path = "../rel4_kernel/sel4_common" }
